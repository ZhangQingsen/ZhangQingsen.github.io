# Shared Quarto configuration for all blog posts (applies to subdirectories).
# Each .qmd renders to a single self-contained HTML (embed-resources: true),
# so no _files/ directories are produced.

project:
  type: default

format:
  html:
    theme:
      - cosmo
      - _includes/custom.scss
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    embed-resources: true
    include-in-header: _includes/fonts.html
    include-before-body: _includes/header.html
    include-after-body: _includes/footer.html
    fig-format: png
    fig-dpi: 96
