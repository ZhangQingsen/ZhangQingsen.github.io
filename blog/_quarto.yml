# Shared Quarto configuration for all blog posts (applies to subdirectories).
# Rendered posts inherit the site's visual identity (colors, fonts, header/footer).

project:
  type: default

format:
  html:
    theme:
      - cosmo
      - _includes/custom.scss
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    embed-resources: false
    include-before-body: _includes/header.html
    include-after-body: _includes/footer.html
    fig-format: png
    fig-width: 7
    fig-height: 4.5
    fig-dpi: 110
