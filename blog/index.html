<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Technical writing, teaching materials, and archived coursework by Qingsen Zhang.">
  <title>Blog | Qingsen Zhang</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="container">
    <header class="site-header">
      <a class="name" href="../">Qingsen Zhang</a>
      <nav aria-label="Main navigation">
        <a href="./">Blog</a>
      </nav>
    </header>

    <section>
      <h1>Blog</h1>
      <p class="lead">
        Technical writing, teaching materials, and archived coursework.
      </p>

      <ul id="post-list" class="blog-list">
        <li>Loading...</li>
      </ul>
    </section>

    <footer>
      <p>© 2026 Qingsen Zhang</p>
    </footer>
  </main>

  <script>
    fetch("posts.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load posts.json");
        }
        return response.json();
      })
      .then(posts => {
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));

        const list = document.getElementById("post-list");
        list.innerHTML = "";

        for (const post of posts) {
          const item = document.createElement("li");

          item.innerHTML = `
            <h2><a href="${post.url}">${post.title}</a></h2>
            <p class="meta">${post.meta}</p>
            <p>${post.description}</p>
          `;

          list.appendChild(item);
        }
      })
      .catch(error => {
        document.getElementById("post-list").innerHTML =
          "<li>Unable to load the blog index.</li>";
        console.error(error);
      });
  </script>
</body>
</html>
