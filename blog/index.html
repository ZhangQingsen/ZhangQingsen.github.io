<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Technical writing, teaching materials, and archived coursework by Qingsen Zhang.">
  <title>Blog | Qingsen Zhang</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="container">
    <header class="site-header">
      <a class="name" href="../">Qingsen Zhang</a>
      <nav aria-label="Main navigation">
        <a href="../">About</a>
        <a href="../work/">Work</a>
        <a href="./" aria-current="page">Blog</a>
        <a href="../cv/">CV</a>
      </nav>
    </header>

    <section>
      <h1>Blog</h1>
      <p class="lead">
        Technical writing, teaching materials, and archived coursework.
      </p>

      <div id="post-groups">
        <p>Loading...</p>
      </div>
    </section>

    <footer>
      <p>© 2026 Qingsen Zhang</p>
    </footer>
  </main>

  <script>
    const GROUPS = [
      { key: "independent", title: "Independent Projects" },
      { key: "coursework", title: "Coursework & Experiments" },
      { key: "teaching", title: "Teaching Materials" }
    ];

    const BADGE_LABELS = {
      independent: "Independent",
      coursework: "Coursework",
      teaching: "Teaching"
    };

    fetch("posts.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load posts.json");
        }
        return response.json();
      })
      .then(posts => {
        posts.sort((a, b) => new Date(b.date) - new Date(a.date));

        const container = document.getElementById("post-groups");
        container.innerHTML = "";

        for (const group of GROUPS) {
          const groupPosts = posts.filter(p => (p.category || "teaching") === group.key);
          if (groupPosts.length === 0) continue;

          const section = document.createElement("section");
          section.className = "blog-group";

          const heading = document.createElement("h2");
          heading.className = "blog-group-title";
          heading.textContent = group.title;
          section.appendChild(heading);

          for (const post of groupPosts) {
            const card = document.createElement("article");
            card.className = "post-card";

            const badge = document.createElement("span");
            badge.className = "badge badge-" + group.key;
            badge.textContent = BADGE_LABELS[group.key];
            card.appendChild(badge);

            const title = document.createElement("h3");
            const link = document.createElement("a");
            link.href = post.url;
            link.textContent = post.title;
            title.appendChild(link);
            card.appendChild(title);

            const meta = document.createElement("p");
            meta.className = "meta";
            meta.textContent = post.meta;
            card.appendChild(meta);

            const desc = document.createElement("p");
            desc.textContent = post.description;
            card.appendChild(desc);

            section.appendChild(card);
          }

          container.appendChild(section);
        }
      })
      .catch(error => {
        document.getElementById("post-groups").innerHTML =
          "<p>Unable to load the blog index.</p>";
        console.error(error);
      });
  </script>
</body>
</html>
